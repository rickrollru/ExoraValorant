name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish src/ExoraValorant/ExoraValorant.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Exora
          path: publish/Exora.exe
